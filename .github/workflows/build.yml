name: 双平台验证与构建
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: go test ./...
      - run: go run ./cmd/prepare-whisper
      - run: node scripts/build.mjs
        env:
          # 公开 API 地址，不是凭据；未配置时仍编译，产物保持未授权。
          CUE_LICENSE_URL: ${{ vars.CUE_LICENSE_URL }}
      # 验证双平台构建；模型权重许可核实前不发布含模型的压缩包。
